[package]
name = "axiomvault-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AxiomVault MCP server over stdio"

[[bin]]
name = "axiom-mcp"
path = "src/main.rs"

[dependencies]
# Protocol and client only: the server links no vault or crypto code.
axiomvault-agent = { path = "../agent", default-features = false }
anyhow.workspace = true
base64.workspace = true
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
# Tests run a real daemon on a vault created directly on disk.
axiomvault-agent = { path = "../agent" }
axiomvault-app = { path = "../app" }
rmcp = { version = "1.7.0", features = ["client", "server", "transport-io"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
zeroize.workspace = true
