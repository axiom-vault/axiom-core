[package]
name = "axiomvault-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AxiomVault key-custody daemon (ssh-agent model) and its socket protocol"

[features]
default = ["daemon"]
# The key-holding daemon and the `axiom-agent` binary. Clients such as the
# MCP server build without it, so they link only the protocol and client and
# never the vault or crypto crates.
daemon = [
    "dep:axiomvault-app",
    "dep:anyhow",
    "dep:base64",
    "dep:libc",
    "dep:rpassword",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "axiom-agent"
path = "src/main.rs"
required-features = ["daemon"]

[[test]]
name = "daemon"
required-features = ["daemon"]

[dependencies]
axiomvault-app = { path = "../app", optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
rpassword = { version = "7.4", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "sync", "time", "rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"], optional = true }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
